      .global-loader {

        align-items: center;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1999;
        width: 100%;
        height: 100%;

        opacity: 1;
        transition: opacity 0.5s ease-in-out;
      }

      .global-loader-fade-in {
        opacity: 0;
      }

      .global-loader-hidden {
        display: none;
      }

      .global-loader p {
        font-family: "Helvetica Neue", Helvetica, sans-serif;
        font-weight: normal;
        font-size: 24px;
        letter-spacing: 0.04rem;
        white-space: pre;

          #009688,
          #8bc34a,
          #ffeb3b,
          #ff9800
        );
        background-size: 750% auto;
        background-position: 0 100%;
        animation: gradient 20s infinite;
        animation-fill-mode: forwards;
        animation-timing-function: linear;

    <script>
      // Registering service worker.
      if (
        "serviceWorker" in navigator &&
        !window.location.hostname.includes("localhost")
      ) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/web_new/sw.js")
            .then((registration) => {
              console.log(
                "Service Worker registered with scope:",
                registration.scope
              );
            })
            .catch((error) => {
              console.error("Service Worker registration failed:", error);
            });
        });

        navigator.serviceWorker.addEventListener("message", (event) => {
          if (
            event.data.action === "reload" &&
            !window.location.hostname.includes("localhost")
          ) {
            window.location.reload();
          }
          if (event.data.type === "IP_ADDRESS") {
            const ipAddress = event.data.ip;
            window.ipAddress = ipAddress;
          }
        });
        console.log = function () {};
        console.warn = function () {};
      }
    </script>

      function encrytChat(plainText) {
        let passphrase = "myverysecretphrase",
