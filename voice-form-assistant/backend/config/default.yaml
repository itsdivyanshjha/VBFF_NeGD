# =============================================================================
# Voice Form Assistant - Default Configuration
# =============================================================================
# This file contains all configuration settings with sensible defaults.
# Environment variables can override any setting using ${VAR:default} syntax.
#
# Priority order:
# 1. This file (default.yaml)
# 2. Environment-specific (environments/{ENV}.yaml)
# 3. Tenant-specific (tenants/{TENANT_ID}.yaml)
# 4. Environment variables
# =============================================================================

# =============================================================================
# Server Configuration
# =============================================================================
server:
  host: "${HOST:0.0.0.0}"
  port: "${PORT:8000}"
  debug: "${DEBUG:false}"

  cors:
    enabled: true
    origins: ["*"]  # For development; restrict in production
    allow_credentials: true
    allow_methods: ["*"]
    allow_headers: ["*"]

# =============================================================================
# Provider Configuration
# =============================================================================
providers:

  # ---------------------------------------------------------------------------
  # Speech-to-Text Providers
  # ---------------------------------------------------------------------------
  stt:
    # Default provider to use
    default: "assemblyai"

    # AssemblyAI (Cloud-based STT with 100+ languages)
    assemblyai:
      enabled: true
      api_key: "${ASSEMBLYAI_API_KEY}"
      base_url: "${ASSEMBLYAI_BASE_URL:https://api.assemblyai.com/v2}"
      timeout: 60
      polling_interval: 0.5
      max_retries: 3

      # Supported languages
      languages: ["hi", "bn", "ta", "te", "mr", "en", "kn", "ml", "or", "pa", "gu", "as"]

      # Entity detection (emails, phone numbers, dates, etc.)
      entity_detection: true

      # Speaker labels (diarization)
      speaker_labels: false

      # Word-level timestamps
      word_timestamps: true

  # ---------------------------------------------------------------------------
  # Language Model Providers
  # ---------------------------------------------------------------------------
  llm:
    # Default provider to use
    default: "openrouter"

    # OpenRouter (Access to multiple LLMs)
    openrouter:
      enabled: true
      api_key: "${OPENROUTER_API_KEY}"
      base_url: "${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}"
      model: "${OPENROUTER_MODEL:meta-llama/llama-3.1-8b-instruct}"
      timeout: 30
      temperature: 0.3
      max_tokens: 500

      # Metadata for OpenRouter
      site_url: "${OPENROUTER_SITE_URL:http://localhost:8000}"
      app_name: "${OPENROUTER_APP_NAME:Voice Form Assistant}"

  # ---------------------------------------------------------------------------
  # Text-to-Speech Providers
  # ---------------------------------------------------------------------------
  tts:
    # Default provider to use
    default: "gtts"

    # Google Text-to-Speech (free, supports many languages)
    gtts:
      enabled: true
      language: "${TTS_LANGUAGE:en}"
      tld: "${TTS_TLD:co.in}"  # co.in for Indian English accent
      slow: false

      # Supported languages
      languages: ["en", "hi", "bn", "ta", "te", "mr", "kn", "ml", "gu", "pa"]

  # ---------------------------------------------------------------------------
  # Session Storage Providers
  # ---------------------------------------------------------------------------
  storage:
    # Default provider to use
    default: "redis"

    # Redis (Fast key-value store)
    redis:
      enabled: true
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      db: "${REDIS_DB:0}"
      password: "${REDIS_PASSWORD:}"
      ttl: 3600  # Session expiry in seconds (1 hour)
      prefix: "voice_assistant:"  # Key prefix for namespacing

# =============================================================================
# Language Configuration
# =============================================================================
languages:
  # Supported languages (ISO 639-1 codes)
  supported: ["hi", "bn", "ta", "te", "mr", "en", "kn", "ml", "or", "pa", "gu", "as"]

  # Default language when detection fails
  default: "hi"

  # Enable automatic language detection
  auto_detect: true

  # Language detection hints (prioritize these languages)
  detection_hints: ["hi", "en", "bn", "ta", "te", "mr"]

# =============================================================================
# Audio Configuration
# =============================================================================
audio:
  # Audio format settings
  sample_rate: 16000  # 16kHz (standard for ASR)
  channels: 1  # Mono
  chunk_duration: 2.0  # Seconds

  # Audio preprocessing
  preprocessing:
    enabled: true
    noise_reduction: true
    auto_gain_control: true

  # Audio validation
  validation:
    min_duration: 0.3  # Minimum duration in seconds
    min_bytes: 4000  # Minimum audio bytes (~0.25 seconds)
    max_duration: 30.0  # Maximum duration in seconds
    max_bytes: 5000000  # Maximum audio bytes (~5MB)

# =============================================================================
# Field Types Configuration
# =============================================================================
field_types:
  # Directory containing field type YAML definitions
  config_dir: "./config/field_types"

  # Field type packs to load
  packs:
    - "india"  # Indian field types (Aadhaar, PAN, etc.)
    # - "usa"  # US field types (SSN, ZIP, etc.) - future
    # - "eu"   # EU field types (IBAN, VAT, etc.) - future

  # Confidence thresholds for field type detection
  detection:
    keyword_score: 10  # Score for keyword match
    pattern_score: 20  # Score for pattern match
    min_score: 5  # Minimum score to detect field type

# =============================================================================
# Conversation Configuration
# =============================================================================
conversation:
  # Conversation flow settings
  max_retries: 2  # Max retries for empty/invalid transcriptions
  empty_transcription_threshold: 2  # Empty transcriptions before asking to speak louder

  # Confidence thresholds
  transcription:
    high_confidence: 0.85  # High confidence threshold
    medium_confidence: 0.5  # Medium confidence threshold
    low_confidence: 0.3  # Low confidence threshold

  # Confirmation settings
  confirmation:
    # Field types that always require confirmation
    critical_types: ["aadhaar", "pan", "passport", "email", "mobile"]

    # Keywords for confirmation (yes/no detection)
    positive_keywords: ["yes", "yeah", "yep", "correct", "right", "haan", "ha", "okay", "ok", "sure", "confirm"]
    negative_keywords: ["no", "nope", "wrong", "incorrect", "nahi", "change", "different"]

  # Conversation history
  history:
    max_messages: 50  # Maximum conversation messages to retain
    include_in_context: 5  # Recent messages to include in LLM context

# =============================================================================
# Prompts Configuration
# =============================================================================
prompts:
  # Template engine: "jinja2" or "simple"
  template_engine: "jinja2"

  # Directory containing prompt templates
  templates_dir: "./config/prompts"

  # Cache compiled templates
  cache_enabled: true

  # Template names (without .j2 extension)
  templates:
    greeting: "greeting"
    ask_field: "ask_field"
    confirmation: "confirmation"
    validation_error: "validation_error"
    extract_value: "extract_value"
    generate_question: "generate_question"

# =============================================================================
# Features Configuration
# =============================================================================
features:

  # Rate Limiting
  rate_limiting:
    enabled: false  # Disabled by default for development
    per_user: 100  # Requests per minute per user
    per_ip: 200  # Requests per minute per IP
    global: 1000  # Global requests per minute

  # Circuit Breaker (fault tolerance)
  circuit_breaker:
    enabled: false  # Disabled by default for development
    failure_threshold: 5  # Failures before opening circuit
    success_threshold: 2  # Successes to close from half-open
    timeout: 60  # Seconds before attempting reset

  # Request Queueing (async processing)
  request_queueing:
    enabled: false  # Disabled by default for development
    max_queue_size: 1000  # Maximum queued requests
    worker_count: 4  # Number of worker threads
    request_timeout: 120  # Request timeout in seconds

  # Retry Logic (exponential backoff)
  retry_logic:
    enabled: true  # Enabled by default
    max_retries: 3  # Maximum retry attempts
    base_delay: 1.0  # Initial delay in seconds
    max_delay: 60.0  # Maximum delay in seconds
    exponential_base: 2  # Exponential backoff multiplier

  # Multi-Tenant Support
  multi_tenant:
    enabled: false  # Disabled by default
    config_per_tenant: false  # Load tenant-specific configs

# =============================================================================
# Observability Configuration
# =============================================================================
observability:

  # Logging
  logging:
    level: "${LOG_LEVEL:INFO}"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
    format: "text"  # "text" or "json"
    outputs: ["stdout"]  # "stdout", "file", "remote"
    file_path: "/var/log/voice-assistant.log"

    # Contextual logging (add context to log messages)
    include_context: true
    context_fields: ["session_id", "field_id", "user_id"]

  # Metrics (Prometheus-compatible)
  metrics:
    enabled: false  # Disabled by default for development
    provider: "prometheus"
    port: 9090
    path: "/metrics"

    # Metrics to collect
    collect:
      - request_rate
      - error_rate
      - latency
      - queue_size
      - active_sessions
      - provider_calls

  # Tracing (OpenTelemetry)
  tracing:
    enabled: false  # Disabled by default
    provider: "jaeger"
    endpoint: "http://localhost:14268/api/traces"
    sample_rate: 0.1  # Sample 10% of requests

# =============================================================================
# Development Configuration
# =============================================================================
development:
  # Hot reload on code changes
  hot_reload: true

  # Detailed error messages
  debug_mode: true

  # Mock providers for testing
  mock_providers: false
