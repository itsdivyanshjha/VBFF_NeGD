# Production Environment Configuration
# This file overrides default.yaml settings for production deployment

server:
  debug: false

  cors:
    origins:
      - "https://yourdomain.com"
      - "https://www.yourdomain.com"
    allow_credentials: true

# Enable production features
features:
  rate_limiting:
    enabled: true
    per_user: 50  # Stricter limits in production
    per_ip: 100

  circuit_breaker:
    enabled: true
    failure_threshold: 5
    timeout: 60

  request_queueing:
    enabled: true
    max_queue_size: 2000
    worker_count: 8  # More workers for production

  retry_logic:
    enabled: true
    max_retries: 5

# Production observability
observability:
  logging:
    level: "WARNING"  # Less verbose in production
    format: "json"  # Structured logs
    outputs: ["stdout", "file"]

  metrics:
    enabled: true
    port: 9090

  tracing:
    enabled: true
    sample_rate: 0.05  # Sample 5% in production

# Stricter conversation settings
conversation:
  max_retries: 1  # Fewer retries in production
  empty_transcription_threshold: 1
