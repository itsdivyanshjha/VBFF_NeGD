# Development Environment Configuration
# This file overrides default.yaml settings for local development

server:
  debug: true

# Development-friendly settings
development:
  hot_reload: true
  debug_mode: true
  mock_providers: false

observability:
  logging:
    level: "DEBUG"  # Verbose logging for development
    format: "text"  # Human-readable logs

# Features disabled by default for easier development
features:
  rate_limiting:
    enabled: false

  circuit_breaker:
    enabled: false

  request_queueing:
    enabled: false

  metrics:
    enabled: false

  tracing:
    enabled: false
